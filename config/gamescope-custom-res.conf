# Configuración de resoluciones internas para Gamescope en Galaxy Book Flex2 Alpha
# Pantalla nativa: 1920x1080 @ 60Hz (Panel QLED eDP)

# Resoluciones recomendadas de renderizado interno (FSR hacia 1080p):
# 1280x720  - Rendimiento óptimo en juegos pesados (Silent Hill 2, TLOU)
# 1366x768  - Punto medio para juegos exigentes
# 1440x810  - Escalado 75% nítido
# 1600x900  - Calidad alta para juegos de dificultad media (Elden Ring, Witcher 3)
# 1920x1080 - Nativo para indies y juegos ligeros (Hades, Dead Cells, Celeste)

GAMESCOPE_OUTPUT_WIDTH=1920
GAMESCOPE_OUTPUT_HEIGHT=1080
GAMESCOPE_OUTPUT_REFRESH=60

# Divisores de fotogramas soportados con latencia constante:
# 30 FPS: 33.33ms (Divisor 1/2) - Ideal para AAA pesados
# 40 FPS: 25.00ms (Divisor 2/3) - Balance fluidez/consumo
# 45 FPS: 22.22ms (Divisor 3/4)
# 60 FPS: 16.66ms (Divisor 1/1) - Para juegos ligeros y emuladores
