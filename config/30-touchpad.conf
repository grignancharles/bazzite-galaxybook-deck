# Configuración de Touchpad idéntica a MacBook para Samsung Galaxy Book
# Activa desplazamiento natural, tap-to-click, clic derecho con 2 dedos y aceleración suave estilo macOS

Section "InputClass"
    Identifier "touchpad"
    Driver "libinput"
    MatchIsTouchpad "on"
    
    # Tocar para hacer clic (1 dedo = izquierdo, 2 dedos = derecho, 3 dedos = central)
    Option "Tapping" "on"
    Option "TappingButtonMap" "lrm"
    Option "TappingDrag" "on"
    Option "TappingDragLock" "off"

    # Desplazamiento Natural (igual a macOS)
    Option "NaturalScrolling" "true"
    Option "ScrollMethod" "twofinger"
    Option "HorizontalScrolling" "true"

    # Clic físico en cualquier parte: 2 dedos para clic secundario (estilo MacBook)
    Option "ClickMethod" "clickfinger"

    # Evitar toques accidentales al escribir
    Option "DisableWhileTyping" "true"

    # Perfil de aceleración adaptativo con curva de respuesta suave como en Mac
    Option "AccelProfile" "adaptive"
    Option "AccelSpeed" "0.15"
EndSection
