# Kernel Arguments para Intel Tiger Lake (i7-1165G7) + Iris Xe (96 EUs)
# Samsung Galaxy Book Flex2 Alpha (NP730QDA)

# 1. Driver Gráfico i915 optimizado con firmware GuC/HuC y compresión FBC
i915.enable_guc=3
i915.enable_fbc=1
i915.enable_psr=0
i915.mitigations=off

# 2. Desactivación de mitigaciones de seguridad de CPU (Máximo rendimiento gaming)
mitigations=off
nowatchdog
nmi_watchdog=0
split_lock_detect=off
preempt=full
threadirqs

# 3. Gobernador de energía y balanceo térmico
intel_pstate=passive
processor.ignore_ppc=1
