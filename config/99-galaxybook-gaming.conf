# Optimizaciones de Kernel Sysctl para Gaming en Bazzite OS (Tiger Lake / Iris Xe)
# Samsung Galaxy Book Flex2 Alpha - 16GB LPDDR4x (4267 MT/s)

# Obligatorio para títulos UE5, Silent Hill 2, The Last of Us, Denuvo y Proton
vm.max_map_count = 2147483642

# Minimizar uso agresivo de swap en disco (aprovechar ZRAM de baja latencia)
vm.swappiness = 10
vm.vfs_cache_pressure = 50

# Reducir acumulación de páginas sucias para evitar caídas de frame rate por I/O flushing
vm.dirty_ratio = 15
vm.dirty_background_ratio = 5

# Desactivar compactación proactiva de memoria para eliminar micro-stuttering
vm.compaction_proactiveness = 0

# Prioridad de scheduling para procesos multimedia / Gamescope
kernel.sched_rt_runtime_us = 980000

# Capacidad de descriptores de archivos para juegos con decenas de miles de assets
fs.file-max = 2097152
