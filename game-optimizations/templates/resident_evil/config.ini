; ==============================================================================
; Perfil Pre-Configurado para Títulos RE Engine (Resident Evil 2/3/4 Remake, 7, 8, Requiem)
; Optimizado para Intel Iris Xe 96 EUs - Sin RayTracing, Sin HairStrands
; ==============================================================================

[Graphics]
RenderingMode=Normal
TargetPlatform=DirectX12
DisplayResolution=1280x720
ResolutionScaling=1.000000
FrameRate=30.000000
V-Sync=On

; Desactivación de Tecnologías que Asfixian a la Iris Xe
RayTracing=False
HairStrands=False
MeshQuality=Low
TextureQuality=Medium
ShadowQuality=Low
ShadowCache=True
ContactShadows=Off
AmbientOcclusion=SSAO
ScreenSpaceReflections=Off
VolumetricLighting=Low
SubsurfaceScattering=Off

; Gestión de VRAM unificada (16GB LPDDR4x)
StreamingMemory=2048MB

; Inyección de Intel XeSS / FSR
UpscalingMethod=XeSS
UpscalingQuality=Balanced
Sharpening=0.500000
