# Optimizaciones DXVK y VKD3D-Proton para Silent Hill 2 Remake en Intel Iris Xe
dxvk.enableAsync = true
dxvk.numCompilerThreads = 4
d3d11.maxTessFactor = 8

# Manejo de compatibilidad D3D12 sin Mesh Shaders nativos
# Forzar a VKD3D a no exigir VK_EXT_mesh_shader y usar fallback de Compute
d3d12.maxFeatureLevel = 12_1
d3d12.forceStaticCBV = true
d3d12.noUploadHvv = true
