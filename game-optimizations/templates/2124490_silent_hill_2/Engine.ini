; ==============================================================================
; Perfil Quirúrgico para Silent Hill 2 Remake (Unreal Engine 5) en Intel Iris Xe
; Arquitectura: Tiger Lake-UP3 (Gen12 Xe-LP) - Elimina Lumen, VSM y alivia Nanite
; ==============================================================================

[SystemSettings]
; 1. Desactivación de Lumen (Software Ray Tracing) -> Retorno a rasterizado clásico PS4
r.Lumen.DiffuseIndirect.Allow=0
r.Lumen.Reflections.Allow=0
r.Lumen.TranslucencyReflections.FrontLayer.Allow=0
r.LumenScene.Radiosity=0
r.Lumen.HardwareRayTracing=0

; 2. Desactivación de Virtual Shadow Maps (VSM) - Ahorra ancho de banda crítico LPDDR4x
r.Shadow.Virtual.Enable=0
r.Shadow.CSM.MaxCascades=1
r.Shadow.RadiusThreshold=0.06
r.DistanceFieldShadowing=0
r.ShadowQuality=1

; 3. Alivio de Nanite y mallas complejas (Fallback de Mesh Shaders)
r.Nanite.MaxPixelsPerEdge=4
r.Nanite.ProjectEnabled=1
r.Nanite.MaxVisibleClusters=4096

; 4. Niebla Volumétrica y Efectos Atmosféricos Pesados
r.VolumetricFog=0
r.Fog=1
r.VolumetricFog.GridPixelSize=16

; 5. Postprocesado y Escala de Resolución (Intel XeSS DP4a / FSR)
r.ScreenPercentage=55
r.DepthOfFieldQuality=0
r.MotionBlurQuality=0
r.SSR.Quality=0
r.BloomQuality=1

; 6. Límite de Fotogramas y Frame Pacing estable a 30 FPS
t.MaxFPS=30
r.VSync=1
