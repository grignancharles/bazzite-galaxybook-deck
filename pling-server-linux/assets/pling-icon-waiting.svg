<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="waitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166" />
      <stop offset="100%" stop-color="#F77F00" />
    </linearGradient>
  </defs>
  <!-- Headset strap -->
  <path d="M 6 32 C 6 18 58 18 58 32" fill="none" stroke="#F77F00" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
