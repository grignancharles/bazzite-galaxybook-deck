<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="activeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#00BBF9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Headset strap -->
  <path d="M 6 32 C 6 18 58 18 58 32" fill="none" stroke="#00BBF9" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <!-- Headset visor body -->
  <rect x="10" y="24" width="44" height="24" rx="10" fill="#121824" stroke="url(#activeGrad)" stroke-width="3" filter="url(#glow)"/>
  <!-- Visor glass reflection -->
  <path d="M 14 30 C 18 27 46 27 50 30 C 50 38 14 38 14 30 Z" fill="url(#activeGrad)" opacity="0.85"/>
  <!-- Center status dot -->
  <circle cx="32" cy="34" r="3" fill="#FFFFFF" />
  <!-- Signal waves -->
  <path d="M 4 24 C 2 28 2 36 4 40" fill="none" stroke="#00F5D4" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 60 24 C 62 28 62 36 60 40" fill="none" stroke="#00F5D4" stroke-width="2.5" stroke-linecap="round" />
</svg>
